{% extends 'base.html'%}
{% load static %}

{% block title %}{{ produit.nom }} | ZEALIMAN{% endblock %}

{% block content %}
<section class="products">
    <div class="product-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="product-item">
            <div class="product-img" style="background-image: url('{{ produit.image.url }}'); height: 500px;"></div>
        </div>
        <div class="product-item">
            <h2 style="font-weight:300; margin-bottom:15px;">{{ produit.nom }}</h2>
            <p class="price" style="font-size:1.3rem;">{{ produit.prix }} FCFA</p>
            <p class="desc" style="margin:20px 0;">{{ produit.description }}</p>
            <p class="desc">Stock disponible : {{ produit.stock }}</p>
            <a href="{% url 'ajouter_au_panier' slug=produit.slug %}" class="btn-outline" style="display:block; text-align:center; text-decoration:none; color:inherit; margin-top:20px;">
                Ajouter au panier
            </a>
        </div>
    </div>
</section>
{% endblock %}
