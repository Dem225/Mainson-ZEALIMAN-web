{% extends 'base.html' %}

{% block title %}Inscription | ZEALIMAN{% endblock %}

{% block content %}
<section class="newsletter">
    <span class="moon-icon">🌙</span>
    <h2>Créer un compte</h2>
    <p>Rejoignez ZEALIMAN pour une expérience d'achat personnalisée.</p>

    <form method="post" style="max-width:400px; margin:40px auto 0; text-align:left;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-dark" style="width:100%; margin-top:15px;">S'inscrire</button>
    </form>

    <p style="margin-top:25px; font-size:0.85rem; color:#777;">
        Déjà un compte ? <a href="{% url 'connexion' %}" style="color:#1a1a1a; font-weight:600;">Connectez-vous</a>
    </p>
</section>
{% endblock %}
