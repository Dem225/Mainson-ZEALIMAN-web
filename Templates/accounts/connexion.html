{% extends 'base.html' %}

{% block title %}Connexion | ZEALIMAN{% endblock %}

{% block content %}
<section class="newsletter">
    <span class="moon-icon">🌙</span>
    <h2>Connexion</h2>
    <p>Accédez à votre compte pour suivre vos commandes.</p>

    <form method="post" style="max-width:400px; margin:40px auto 0; text-align:left;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-dark" style="width:100%; margin-top:15px;">Se connecter</button>
    </form>

    <p style="margin-top:25px; font-size:0.85rem; color:#777;">
        Pas encore de compte ? <a href="{% url 'inscription' %}" style="color:#1a1a1a; font-weight:600;">Inscrivez-vous</a>
    </p>
</section>
{% endblock %}
